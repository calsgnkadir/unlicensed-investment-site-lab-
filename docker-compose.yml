# Yerel laboratuvar ortamı. Portlar yalnızca bu makineden (127.0.0.1) erişilebilir.
# Başlatmadan önce: cp .env.example .env ve parolayı değiştirin.
# İzleme (Prometheus + Grafana) isteğe bağlıdır: docker compose --profile monitoring up -d
name: fraud-lab

services:
  db:
    # Sabit sürüm. tests/Fraud.Integration.Tests/Infrastructure/PostgresFixture.cs ile aynı olmalı.
    image: postgres:17.9-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud_lab
      POSTGRES_USER: fraud_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_lab -d fraud_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: src/Fraud.Api/Dockerfile
    image: fraud-lab-api:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FraudDb: "Host=db;Port=5432;Database=fraud_lab;Username=fraud_lab;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      # Şemayı yalnızca bu servis günceller. İki servis aynı anda migration uygulamaya çalışmasın diye
      # toplayıcıda kapalıdır; toplayıcı, bu servis sağlıklı (yani migration bitmiş) olunca başlar.
      Database__MigrateOnStartup: "true"
      # Prometheus metrikleri konteynerin 9464 portunda; host'a yayımlanmaz (yalnızca compose ağındaki Prometheus).
      Metrics__Enabled: "true"
      Metrics__Host: "*"
    ports:
      - "127.0.0.1:${API_PORT:-58080}:8080"
    healthcheck:
      # Çalışma imajında curl yok; uygulama kendi /health/ready adresini sorar.
      test: ["CMD", "dotnet", "Fraud.Api.dll", "--health-probe"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # crt.sh ve Wayback toplayıcısı. Dış kaynaklara istek attığı için varsayılan olarak BAŞLAMAZ;
  # yalnızca açıkça istenince çalışır: docker compose --profile collectors up -d collectors
  collectors:
    profiles: ["collectors"]
    build:
      context: .
      dockerfile: src/Fraud.Collectors/Dockerfile
    image: fraud-lab-collectors:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # API, açılışta migration'ı uygular ve ancak sonra sağlıklı olur.
      api:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__FraudDb: "Host=db;Port=5432;Database=fraud_lab;Username=fraud_lab;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Database__MigrateOnStartup: "false"
      Collection__MeasurementLocation: ${MEASUREMENT_LOCATION:-lab-local}
      Metrics__Enabled: "true"
      Metrics__Host: "*"
    command: ["worker"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # İzleme: yalnızca "monitoring" profiliyle başlar. Linux kurulumundaki kurallar ve panel ortaktır.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/linux/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.2.6@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    restart: unless-stopped
    depends_on:
      - prometheus
    # Parola .env'den gelir. Compose, profil kapalıyken de değişkenleri çözdüğü için burada ":?" kullanılamaz
    # (izlemeyi istemeyen herkesin compose'u bozulurdu). Bunun yerine konteyner, parola boşsa hiç açılmaz;
    # Grafana'nın varsayılan "admin/admin" parolası hiçbir durumda kullanılmaz.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "GRAFANA_ADMIN_PASSWORD .env içinde tanımlı olmalı." >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_LOG_MODE: console
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fraud-lab.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-53001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/linux/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/linux/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
  prometheus_data:
  grafana_data:
