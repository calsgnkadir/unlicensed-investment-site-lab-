name: CI

on:
  push:
    branches: [main]
  pull_request:

# İş akışı yalnızca kodu okur; depoya yazma yetkisi yok.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Testcontainers için Docker gerekir; GitHub'ın Ubuntu çalıştırıcısında Docker hazır gelir.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      # Eylemler etiket yerine sabit commit ile çağrılır (etiket sonradan değiştirilebilir).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FraudLab.slnx --locked-mode

      - name: Build
        run: dotnet build FraudLab.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test FraudLab.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

      - name: Build API image
        run: docker build --file src/Fraud.Api/Dockerfile --tag fraud-lab-api:ci .

      # Linux kurulum paketi: compose dosyası geçerli mi, betikler shellcheck'ten geçiyor mu (çalıştırıcıda hazır gelir).
      - name: Check Linux deploy package
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          GRAFANA_ADMIN_PASSWORD: ci-only-not-a-secret
          CT_NEUTRAL_SALT: ci-only-not-a-secret
        run: |
          docker compose -f deploy/linux/docker-compose.ct.yml config -q
          docker compose -f deploy/linux/docker-compose.ct.yml -f deploy/linux/docker-compose.monitoring.yml config -q
          docker compose -f docker-compose.yml --profile monitoring config -q
          shellcheck deploy/linux/*.sh
          # Windows bildirim betiği: yalnızca ayrıştırma denetimi (çalıştırılmaz; WSL ve bildirim API'si Windows'a özgü).
          pwsh -NoProfile -Command '$e = $null; $t = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("deploy/windows/fraud-lab-check.ps1", [ref]$t, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { $_.Message }; exit 1 }'

      # İzleme ayarı: Prometheus ayarı ve uyarı kuralları geçerli mi, uyarı birim testleri (CtFollowerStalled,
      # UnexpectedOpenPort, DnsErrorRateHigh ...) geçiyor mu, Grafana paneli geçerli JSON mu.
      # promtool, kurulumdaki Prometheus imajının aynısından (sürüm + özet) çalışır; ağa çıkmaz.
      - name: Check monitoring config
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
        run: |
          docker run --rm --network none -v "$PWD/deploy/linux/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
          docker run --rm --network none -v "$PWD/deploy/linux/monitoring/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus/tests --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" test rules fraud-lab.test.yml
          docker run --rm --network none -v "$PWD/deploy/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/linux/monitoring/prometheus/rules:/etc/prometheus/rules:ro" \
            --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
          for f in deploy/linux/monitoring/grafana/dashboards/*.json; do
            python3 -m json.tool "$f" > /dev/null
            # Panel yalnızca sabit uid'li veri kaynağını kullanmalı (provisioning/datasources/prometheus.yml).
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["uid"]; assert all(t["datasource"]["uid"]=="prometheus" for p in d["panels"] for t in p.get("targets",[]))' "$f"
          done

      - name: Build collectors image
        run: docker build --file src/Fraud.Collectors/Dockerfile --tag fraud-lab-collectors:ci .
