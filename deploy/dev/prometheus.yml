# Geliştirme (Windows, kök docker-compose.yml, "monitoring" profili) için Prometheus ayarı.
# Uyarı kuralları Linux kurulumuyla ortaktır (deploy/linux/monitoring/prometheus/rules). Burada port denetimi yok
# (Windows'ta /proc/net yok); collectors servisi de varsayılan olarak başlamaz, bu yüzden "CollectorDown" uyarısı
# geliştirme ortamında beklenen bir durumdur.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:9464"]
    relabel_configs:
      - target_label: instance
        replacement: api

  - job_name: collectors
    static_configs:
      - targets: ["collectors:9464"]
    relabel_configs:
      - target_label: instance
        replacement: collectors

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
    relabel_configs:
      - target_label: instance
        replacement: prometheus
