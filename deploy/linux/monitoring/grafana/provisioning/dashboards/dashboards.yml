# Panel dosyaları /etc/grafana/dashboards altından (salt okunur) yüklenir. Arayüzden yapılan değişiklik kaydedilmez;
# kalıcı değişiklik için JSON'u depoda düzenleyin.
apiVersion: 1

providers:
  - name: fraud-lab
    folder: fraud-lab
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
