# Canlı Static CT akışı (ct-follow) için Linux kurulumu. Yalnızca veritabanı ve izleyici çalışır; API bu makinede yok.
#
# Kullanım (bu klasörden): ./install.sh
# Elle: docker compose -f docker-compose.ct.yml up -d --build
#
# .env bu klasörde durur (install.sh oluşturur, izni 600). Depoya girmez (.gitignore: .env).
#
# Açılış sırası:
#   1. db sağlıklı olur.
#   2. migrate şemayı bir kez günceller ve çıkar (bu kurulumda şemayı yalnızca o günceller).
#   3. ct-follow ve network, migrate başarıyla bitince başlar. Kendileri migration yapmaz.
# Makine yeniden açılınca Docker, db, ct-follow ve network'ü kendisi başlatır; migrate tekrar çalışmaz (restart: "no").
#
# network: Günlük ağ kaydı (worker). Sırayla DNS (UDP, TCP, DoH; saniyede en fazla 1 paket), RIPEstat ve InternetDB.
# Açılışta hemen bir tur yapar, sonra 24 saat bekler. Yeniden başlarsa önbellek tekrar sorguyu önler
# (DNS 20 saat, RIPEstat ve InternetDB IP başına 7 gün), veri çoğalmaz.
# ct-follow veritabanı hazır olmadan başlarsa turu hata sayar, bekler ve yeniden dener.
#
# İzleme (Hafta 5): ct-follow ve network, Prometheus metriklerini kendi konteynerlerinde 9464 portundan verir. Bu port
# host'a YAYIMLANMAZ; yalnızca dışarı çıkışı olmayan "metrics" iç ağındaki Prometheus okur. Prometheus, Grafana ve port
# denetimi ayrı dosyadadır: docker-compose.monitoring.yml (install.sh ikisini birlikte kullanır). Bu dosya tek başına da
# çalışır; o zaman yalnızca izleme olmaz.

name: fraud-lab-ct

x-logging: &logging
  # Konteyner logları diskte sınırsız büyümesin: dosya başına 10 MB, en fazla 5 dosya.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-collectors: &collectors
  build:
    context: ../..
    dockerfile: src/Fraud.Collectors/Dockerfile
  image: fraud-lab-collectors:linux
  depends_on:
    db:
      condition: service_healthy
  # İç ağ (veritabanı), dışarı çıkış ağı ve metrik iç ağı. Hiçbir port dışarı açılmaz.
  networks:
    - backend
    - egress
    - metrics
  # İmajdaki hazır, yetkisiz kullanıcı (USER $APP_UID, root değil). Dockerfile'da tanımlı.
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  db:
    # Sabit sürüm. Kök docker-compose.yml ve tests/.../PostgresFixture.cs ile aynı olmalı.
    image: postgres:17.9-alpine3.23
    restart: unless-stopped
    # İmajdaki postgres kullanıcısı (alpine'da uid/gid 70). Yeni adlandırılmış birim, imajdaki sahipliği aldığı için
    # veri klasörü bu kullanıcıya aittir; giriş betiği root yetkisi istemez.
    user: "70:70"
    environment:
      POSTGRES_DB: fraud_lab
      POSTGRES_USER: fraud_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    # Port YAYIMLANMAZ. Yedek ve durum betikleri "docker compose exec" ile konteynerin içinden bağlanır.
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_lab -d fraud_lab"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=1m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: "128m"
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 60s
    logging: *logging

  # Şemayı bir kez günceller ve çıkar.
  migrate:
    <<: *collectors
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__FraudDb: "Host=db;Port=5432;Database=fraud_lab;Username=fraud_lab;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
    command: ["migrate"]
    # Migration dışarıya istek atmaz; çıkış ağına gerek yok.
    networks:
      - backend
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128

  ct-follow:
    <<: *collectors
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__FraudDb: "Host=db;Port=5432;Database=fraud_lab;Username=fraud_lab;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Database__MigrateOnStartup: "false"
      Collection__MeasurementLocation: ${MEASUREMENT_LOCATION:-lab-linux}
      # appsettings.json'daki sıraya göre: 0 = sycamore2026h2, 1 = sycamore2027h1.
      # Bu kurulumun varsayılanı appsettings.json'dan farklıdır: 2027h1 açık, 2026h2 kapalı. Yeni 90 günlük
      # sertifikalar 2027h1'e düşüyor; 2026h2 dilimi 17 Aralık 2026'da kapanıyor.
      StaticCt__Logs__0__Enabled: ${CT_ENABLE_2026H2:-false}
      StaticCt__Logs__1__Enabled: ${CT_ENABLE_2027H1:-true}
      # İki isteğin başlangıcı arasındaki en kısa süre (log başına) ve aynı anda en fazla istek.
      # 0,25 sn ve 4 eşzamanlı = en fazla 4 istek/sn. 2027h1 ~1 tile/sn üretiyor; ev makinesi her zaman açık olmadığı
      # için kapalı kalınan süreyi yakalamak gerekiyor (2026-11-15: 18 milyon kayıt gerideydi). static-ct-api tile'ları
      # değişmez ve önbelleğe alınabilir tanımlar, paralel çekmeyi açıkça öngörür; tanımlı bir hız sınırı yoktur.
      # Kod 100 ms altına ve 8 eşzamanlıdan fazlasına izin vermez (StaticCtOptions.Validate).
      StaticCt__MinRequestInterval: ${CT_MIN_REQUEST_INTERVAL:-00:00:00.250}
      StaticCt__MaxConcurrency: ${CT_MAX_CONCURRENCY:-4}
      # Etkin her log hatasız bir tur bitirdikçe yenilenir; sağlık kontrolü yaşına bakar.
      StaticCt__HeartbeatFile: /tmp/ct-follow.heartbeat
      # Tarafsız örneklem (Çerçeve N, KONTROL_GRUBU_YONTEMI.md 4.5): kayıtlı alan adlarının ~%1'i, kelimeye bakılmadan.
      # Tuz .env içinde (install.sh bir kez üretir). Tuz yoksa compose başlamaz; ct-follow da tuzsuz başlamaz.
      # Oran yalnızca dondurmadan önce bir kez değiştirilebilir (karar 3).
      NeutralSample__Salt: ${CT_NEUTRAL_SALT:?CT_NEUTRAL_SALT .env dosyasında tanımlı olmalı (install.sh üretir)}
      NeutralSample__Rate: ${CT_NEUTRAL_RATE:-0.01}
      # Metrikler: konteynerin içinde 9464 (yayımlanmaz). Tablo tazeliği yalnızca bu süreçte, dakikada bir okunur.
      Metrics__Enabled: "true"
      Metrics__Host: "*"
      Metrics__Port: "9464"
      Metrics__Freshness__Enabled: "true"
    command: ["ct-follow"]
    healthcheck:
      # Çalışma imajında curl yok. Dosya 15 dakikadan eskiyse (her log en az bir tur başaramadıysa) sağlıksız.
      test: ["CMD-SHELL", "test -f /tmp/ct-follow.heartbeat && [ $$(( $$(date +%s) - $$(stat -c %Y /tmp/ct-follow.heartbeat) )) -lt 900 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    # Başlamış bir veritabanı yazması bitsin diye.
    stop_grace_period: 45s

  network:
    <<: *collectors
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_EnableDiagnostics: "0"
      ConnectionStrings__FraudDb: "Host=db;Port=5432;Database=fraud_lab;Username=fraud_lab;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Database__MigrateOnStartup: "false"
      Collection__MeasurementLocation: ${DNS_LOCATION:-tr-ev-ubuntu}
      # Ölçüm konumu kararı: docs/DECISIONS.md, 2026-11-13. Bütün gruplar aynı konumdan ölçülür.
      Dns__Location: ${DNS_LOCATION:-tr-ev-ubuntu}
      # Sıra önemli: RIPEstat ve InternetDB, IP'leri DNS turunun DoH cevaplarından alır.
      Worker__Sources__0: Dns
      Worker__Sources__1: RipeStat
      Worker__Sources__2: InternetDb
      # crt.sh ve Wayback: pozitifler 7 günde bir, kontrol üyeleri alan adı başına BİR KEZ (önbellek). crt.sh aralığı
      # varsayılan 15 sn; kod 12 sn'nin altına izin vermez (işletmeci: IP başına dakikada 5 istek). Kaynak kilidi elle
      # başlatılan ikinci bir süreci durdurur.
      Worker__Sources__3: CrtSh
      Worker__Sources__4: WaybackCdx
      # Kontrol üyelerinin haftalık DNS günleri (Türkiye saatiyle). Üyeler iki güne karışık bölünür; pozitifler günlük.
      Collection__ControlDnsDays__0: Saturday
      Collection__ControlDnsDays__1: Sunday
      Worker__Interval: "1.00:00:00"
      # Metrikler: konteynerin içinde 9464 (yayımlanmaz).
      Metrics__Enabled: "true"
      Metrics__Host: "*"
      Metrics__Port: "9464"
    command: ["worker"]
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    stop_grace_period: 30s

  # Araç servisi: Yalnızca "--profile tools" ile ve "run --rm" ile çalışır; hiç sürekli çalışmaz, port yayımlamaz.
  # Kontrol listesi ve ölçüm komutları depo kökünde (/repo) derlenip çalıştırılır: git, docs/research/finans_sozlugu.txt
  # ve docs/evaluation/control_sources.json gerekir. Kullanım (bu klasörden):
  #   docker compose --profile tools run --rm tools control-build-g1 --input data/private/control/src/bddk-77-<tarih>.html
  # Depo salt okunur; yalnızca data/private ve docs/evaluation/commitments yazılabilir (ikisi de konakta önceden olmalı:
  # mkdir -p ../../data/private ../../docs/evaluation/commitments). Radar token'ı deploy/linux/secrets/cloudflare_radar_token
  # dosyasından okunur; depo bağlaması salt okunur olduğu için token da salt okunur. Ayrı bir dosya bağlaması bilerek yok:
  # Dosya yokken Docker konakta onun yerine kök sahipli bir KLASÖR açardı. Dış ağ yalnızca kodun izin listesindeki
  # ana bilgisayarlar için (bddk.org.tr, tranco-list.eu, api.cloudflare.com, crt.sh); bağlantı anında denetlenir.
  # Sınır: Depo salt okunur olduğu için kilitli test (git worktree) bu serviste çalışmaz.
  tools:
    profiles: ["tools"]
    build:
      context: ./tools
      args:
        TOOLS_UID: ${TOOLS_UID:-1000}
    image: fraud-lab-tools:linux
    restart: "no"
    user: "${TOOLS_UID:-1000}:${TOOLS_UID:-1000}"
    working_dir: /repo
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__FraudDb: "Host=db;Port=5432;Database=fraud_lab;Username=fraud_lab;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Database__MigrateOnStartup: "false"
      Collection__MeasurementLocation: ${MEASUREMENT_LOCATION:-lab-linux}
    volumes:
      - ../..:/repo:ro
      - ../../data/private:/repo/data/private
      - ../../docs/evaluation/commitments:/repo/docs/evaluation/commitments
      - tools_nuget:/nuget
      - tools_build:/build
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/tools:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512

networks:
  # İç ağ: Dışarıya çıkışı yok. Veritabanı yalnızca burada.
  backend:
    internal: true
  # ct-follow'un CT loguna, network'ün DNS çözücülerine (UDP/TCP 53, 443), RIPEstat ve InternetDB'ye gidebilmesi için çıkış ağı.
  egress: {}
  # Metrik iç ağı: Dışarıya çıkışı yok. Prometheus (docker-compose.monitoring.yml) toplayıcıların 9464 portunu buradan okur.
  # Veritabanı bu ağda değil; Prometheus veritabanına ulaşamaz.
  metrics:
    internal: true

volumes:
  db_data:
  # Araç servisinin NuGet önbelleği ve derleme çıktısı (her çalıştırmada yeniden indirme ve tam derleme olmasın).
  tools_nuget:
  tools_build:
